{
  "name": "AXXES CI",
  "on": {
    "pull_request": {
      "branches": [
        "main"
      ]
    },
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "axxes-ci-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "verify": {
      "name": "Verify on Linux",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 25,
      "services": {
        "postgres": {
          "image": "postgres:17",
          "env": {
            "POSTGRES_USER": "ci",
            "POSTGRES_PASSWORD": "ci",
            "POSTGRES_DB": "ci"
          },
          "ports": [
            "5432:5432"
          ],
          "options": "--health-cmd \"pg_isready -U ci\" --health-interval 5s --health-timeout 5s --health-retries 12"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
          "with": {
            "node-version": "24",
            "cache": "npm"
          }
        },
        {
          "name": "Install locked dependencies",
          "run": "npm ci",
          "env": {
            "DATABASE_URL": "postgresql://ci:ci@127.0.0.1:5432/ci"
          }
        },
        {
          "name": "Run existing feature tests",
          "run": "npm run build && node scripts/test-prisma-cache.cjs",
          "env": {
            "STORAGE_TEST_DATABASE_URL": "postgresql://ci:ci@127.0.0.1:5432/ci",
            "COMMERCE_TEST_DATABASE_URL": "postgresql://ci:ci@127.0.0.1:5432/ci",
            "FINANCIAL_TEST_DATABASE_URL": "postgresql://ci:ci@127.0.0.1:5432/ci"
          }
        },
        {
          "name": "Build on Linux with fixture configuration",
          "run": "npm run build",
          "env": {
            "DATABASE_URL": "postgresql://ci:ci@127.0.0.1:5432/ci",
            "BETTER_AUTH_SECRET": "ci-only-placeholder-secret-with-at-least-32-characters",
            "AUTH_SECRET": "ci-only-placeholder-secret-with-at-least-32-characters",
            "BETTER_AUTH_URL": "http://localhost:3000",
            "NEXT_PUBLIC_APP_URL": "http://localhost:3000",
            "NEXT_PUBLIC_BASE_URL": "http://localhost:3000",
            "NEXT_PUBLIC_SITE_URL": "http://localhost:3000",
            "NEXT_TELEMETRY_DISABLED": "1"
          }
        }
      ]
    }
  }
}
