name: GCP production
on:
  push:
    branches: [deploy/gcp]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: gcp-production-api
  cancel-in-progress: false
jobs:
  cloud-build:
    if: github.ref == 'refs/heads/deploy/gcp'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/777200802352/locations/global/workloadIdentityPools/axxes-github/providers/github
          service_account: gh-api@gravy-meta.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Submit and wait for Google Cloud Build
        shell: bash
        run: |
          set -euo pipefail
          build_id=$(gcloud builds submit . --project=gravy-meta --region=us-west1 --config=cloudbuild.yaml --service-account=projects/gravy-meta/serviceAccounts/cb-api@gravy-meta.iam.gserviceaccount.com --gcs-source-staging-dir=gs://gravy-meta-ci-api/source --substitutions=_TAG="$GITHUB_SHA" --async --format='value(id)')
          echo "Google Cloud Build: $build_id"
          for attempt in $(seq 1 210); do
            status=$(gcloud builds describe "$build_id" --project=gravy-meta --region=us-west1 --format='value(status)')
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) echo "Build ended: $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo 'Build polling exceeded time limit'; exit 1
