# Builds an AXXES app image. Usage:
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_APP=<service>,_TAG=<git sha>
substitutions:
  _REGION: us-west1
  _REPO: axxes
steps:
  - id: build-env
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: ["-c", "gcloud secrets versions access latest --secret=${_APP}-env > .env.production"]
  - id: image
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_APP}:${_TAG}", "."]
images: ["${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_APP}:${_TAG}"]
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
