{
  "substitutions": {
    "_TAG": "manual"
  },
  "steps": [
    {
      "id": "linux-build-and-check",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "build",
        "-t",
        "ci-check:$BUILD_ID",
        "."
      ]
    },
    {
      "id": "runtime-image",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "build",
        "-t",
        "us-west1-docker.pkg.dev/$PROJECT_ID/ci-api/api:${_TAG}-$BUILD_ID",
        "."
      ]
    },
    {
      "id": "export-runtime-layers",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "save",
        "-o",
        ".ci-image.tar",
        "us-west1-docker.pkg.dev/$PROJECT_ID/ci-api/api:${_TAG}-$BUILD_ID"
      ]
    },
    {
      "id": "verify-no-secret-layers",
      "name": "gcr.io/google.com/cloudsdktool/cloud-sdk:slim",
      "entrypoint": "python3",
      "args": [
        "scripts/gcp-scan-image.py",
        ".ci-image.tar",
        ".env.production"
      ]
    },
    {
      "id": "remove-build-inputs",
      "name": "gcr.io/google.com/cloudsdktool/cloud-sdk:slim",
      "entrypoint": "bash",
      "args": [
        "-ec",
        "rm -f .ci-image.tar .env.production"
      ]
    },
    {
      "id": "push-image",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "push",
        "us-west1-docker.pkg.dev/$PROJECT_ID/ci-api/api:${_TAG}-$BUILD_ID"
      ]
    },
    {
      "id": "release",
      "name": "gcr.io/google.com/cloudsdktool/cloud-sdk:slim",
      "entrypoint": "bash",
      "args": [
        "-c",
        "set -euo pipefail\nimage='us-west1-docker.pkg.dev/$PROJECT_ID/ci-api/api:${_TAG}-$BUILD_ID'\ndigest=$(gcloud artifacts docker images describe \"$$image\" --format='value(image_summary.digest)')\nexport CI_SERVICE='api' CI_BUILD_ID='$BUILD_ID' CI_IMAGE=\"$${image%:*}@$$digest\"\npython3 scripts/gcp-release.py\n"
      ]
    }
  ],
  "images": [
    "us-west1-docker.pkg.dev/$PROJECT_ID/ci-api/api:${_TAG}-$BUILD_ID"
  ],
  "options": {
    "machineType": "E2_HIGHCPU_8",
    "logging": "CLOUD_LOGGING_ONLY"
  },
  "timeout": "1800s"
}
